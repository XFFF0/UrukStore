name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project UrukStore.xcodeproj \
            -scheme UrukStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Publish error log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-fail-${{ github.run_number }}"
          {
            echo '```'
            grep -n -B2 -A2 "error:" build.log | tail -c 60000
            echo '```'
          } > error-excerpt.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Build FAILED #${{ github.run_number }}" \
            --notes-file error-excerpt.md || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/UrukStore.app Payload/
          zip -r UrukStore.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrukStore-unsigned
          path: UrukStore.ipa

      - name: Publish as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" UrukStore.ipa \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Unsigned IPA from commit ${{ github.sha }}" \
            --latest
