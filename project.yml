name: UrukStore
options:
  bundleIdPrefix: com.urukstore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO

packages:
  AltSign:
    url: https://github.com/SideStore/AltSign.git
    exactVersion: 1.0.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  Minimuxer:
    url: https://github.com/SideStore/minimuxer.git
    branch: develop

targets:
  UrukStore:
    type: application
    platform: iOS
    sources:
      - path: Sources/UrukStore
    dependencies:
      - package: AltSign
        product: AltSign-Dynamic
        embed: true
        codeSign: false
      - package: ZIPFoundation
      - package: Minimuxer
    info:
      path: Sources/UrukStore/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "UrukStore talks to your device over the local VPN tunnel (e.g. StosVPN) to install signed apps."
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urukstore.app
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
